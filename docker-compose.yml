services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: file:/data/bookshelf.db
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      AUTH_TRUST_HOST: "true"
      ANDROID_SHA256_FINGERPRINT: ${ANDROID_SHA256_FINGERPRINT:-}
    ports:
      - "${APP_PORT:-1024}:3000"
    volumes:
      - app-data:/data

volumes:
  app-data:
