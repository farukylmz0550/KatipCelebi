<?xml version="1.0" encoding="UTF-8"?>
<!--
  KatipCelebi — GNOME HIG App Icon
  Squircle shape (superellipse), GNOME Adwaita Blue palette
  512x512 canvas
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- GNOME squircle clip -->
    <clipPath id="squircle">
      <path d="M256 48C141.6 48 48 141.6 48 256s93.6 208 208 208 208-93.6 208-208S370.4 48 256 48z
               M256 464C141.3 464 48 370.7 48 256S141.3 48 256 48c70.4 0 132.6 30.2 176.2 78.4
               C417 148.8 424 175.2 424 204c0 39.2-20 73.6-50.4 94.4C345.2 320 312.4 336 276 336
               H252c-56 0-104-32-128-80-12-24-20-52-20-80 0-36 12-68 32-96
               C152 60 200 48 256 48z"/>
    </clipPath>
    <!-- Subtle shadow gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a9eef"/>
      <stop offset="100%" stop-color="#1a5fb4"/>
    </linearGradient>
  </defs>

  <!-- Background: GNOME Blue squircle -->
  <rect width="512" height="512" rx="102" ry="102" fill="url(#bgGrad)"/>

  <!-- Subtle border/shadow for depth -->
  <rect width="512" height="512" rx="102" ry="102" fill="none" stroke="#0d47a1" stroke-width="2" stroke-opacity="0.15"/>

  <!-- Open Book -->
  <g transform="translate(256, 260)">
    <!-- Book spine shadow -->
    <rect x="-2" y="-90" width="4" height="130" rx="2" fill="#0d47a1" fill-opacity="0.15"/>

    <!-- Left page -->
    <path d="M0,-80 Q-80,-75 -120,-60 L-120,55 Q-80,45 0,55 Z"
          fill="#ffffff" fill-opacity="0.95"/>
    <!-- Left page lines -->
    <line x1="-100" y1="-40" x2="-20" y2="-44" stroke="#deddda" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-100" y1="-20" x2="-20" y2="-24" stroke="#deddda" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-100" y1="0" x2="-20" y2="-4" stroke="#deddda" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-100" y1="20" x2="-20" y2="16" stroke="#deddda" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-80" y1="40" x2="-20" y2="36" stroke="#deddda" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Right page -->
    <path d="M0,-80 Q80,-75 120,-60 L120,55 Q80,45 0,55 Z"
          fill="#ffffff" fill-opacity="0.85"/>
    <!-- Right page lines -->
    <line x1="20" y1="-44" x2="100" y2="-40" stroke="#deddda" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="20" y1="-24" x2="100" y2="-20" stroke="#deddda" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="20" y1="-4" x2="100" y2="0" stroke="#deddda" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="20" y1="16" x2="100" y2="20" stroke="#deddda" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="20" y1="36" x2="80" y2="40" stroke="#deddda" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Center spine highlight -->
    <line x1="0" y1="-80" x2="0" y2="55" stroke="#ffffff" stroke-width="2" stroke-opacity="0.5" stroke-linecap="round"/>

    <!-- Bookmark ribbon (GNOME green accent) -->
    <path d="M40,-80 L40,-100 L50,-90 L60,-100 L60,-80 L50,-70 Z"
          fill="#33d17a"/>
  </g>

  <!-- Small decorative dot (GNOME style subtle accent) -->
  <circle cx="380" cy="120" r="8" fill="#ffffff" fill-opacity="0.2"/>
</svg>
